name: Build VixenMMD Release

on:
  workflow_dispatch:
  workflow_call:

env:
  mmdPackage: com.vixencreations.vixen-mmd
  packagePath: Packages/com.vixencreations.vixen-mmd

jobs:

  # Zip the VixenMMD package and release it with its package.json so the listing picks it up.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@b9f36ce6ee6fe2680cd3c32b2c62e22eade7e590
        with:
            file_path: "${{ env.packagePath }}/package.json"
            prop_path: "version"

      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ env.mmdPackage }}-${{ steps.version.outputs.value }}.zip" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" .

      # VixenMMD tags carry a prefix so they never collide with the Toolbox's own version tags.
      - name: Create Tag
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "vixen-mmd-${{ env.version }}"
          tag_exists_error: false

      # make_latest false keeps the Toolbox release as Latest, which the version badge and the site read.
      - name: Make Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: "VixenMMD ${{ env.version }}"
          files: |
            ${{ env.zipFile }}
            ${{ env.packagePath }}/package.json
          tag_name: "vixen-mmd-${{ env.version }}"
          make_latest: false
