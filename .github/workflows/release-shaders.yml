name: Build Shader Release

on:
  workflow_dispatch:

env:
  shaderPackage: com.vixencreations.vixforge-shaders
  packagePath: VPM/com.vixencreations.vixforge-shaders

jobs:

  # Zip the VixForge Shaders package that VixenWear's packaging/build_vpm.py wrote into VPM/,
  # and release it with its package.json so the listing picks it up.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      - name: Check Package Folder
        run: |
          if [ ! -f "${{ env.packagePath }}/package.json" ]; then
            echo "No ${{ env.packagePath }}/package.json. Run build_vpm.py --write first and commit the folder.";
            exit 1;
          fi

      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@b9f36ce6ee6fe2680cd3c32b2c62e22eade7e590
        with:
            file_path: "${{ env.packagePath }}/package.json"
            prop_path: "version"

      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ env.shaderPackage }}-${{ steps.version.outputs.value }}.zip" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      # The marker only tells build_vpm.py that the folder is its own export; it does not ship.
      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" . -x ".vixforge-vpm"

      # Shader tags carry a prefix so they never collide with the Toolbox's own version tags.
      - name: Create Tag
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "vixforge-shaders-${{ env.version }}"
          tag_exists_error: false

      - name: Make Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: "VixForge Shaders ${{ env.version }}"
          files: |
            ${{ env.zipFile }}
            ${{ env.packagePath }}/package.json
          tag_name: "vixforge-shaders-${{ env.version }}"
